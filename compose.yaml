name: retail-agent-bench

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: retail_eval
      POSTGRES_USER: retail_eval
      POSTGRES_PASSWORD: ${RETAIL_EVAL_DB_PASSWORD:-retail_eval_local}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - retail_eval_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_eval -d retail_eval"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
    ports:
      - "127.0.0.1:19000:4566"
    volumes:
      - retail_eval_audio:/var/lib/localstack
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  retail_eval_postgres:
  retail_eval_audio:
